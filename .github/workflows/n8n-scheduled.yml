# Free "serverless n8n": GitHub starts a VM on schedule, imports every workflow in ./workflows into a
# throw-away n8n container, runs them one after another, then discards the container.
# Cron times are UTC (IST = UTC+5:30). 4 runs per weekday.
#
# Which files run?  Every workflows/*.json EXCEPT names starting with "telegram-hi-" or "_"
# (those need an always-on n8n). Drop a new .json into ./workflows and it runs automatically.
name: n8n scheduled runs

on:
  schedule:
    - cron: '0 4,8,14 * * 1-5'   # IST 09:30, 13:30, 19:30 (Mon-Fri)
    - cron: '45 9 * * 1-5'       # IST 15:15 (Mon-Fri)
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: run only workflows whose file name contains this text (e.g. india). Empty = all'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      N8N_VERSION: latest            # pin e.g. 1.100.1 for stability
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4

      - name: Find workflows to run
        run: |
          IDS=""
          for f in workflows/*.json; do
            b=$(basename "$f")
            case "$b" in telegram-hi-*|_*) echo "skip   $b (needs always-on n8n)"; continue;; esac
            case "$b" in *"$ONLY"*) ;; *) echo "skip   $b (filter: $ONLY)"; continue;; esac
            id=$(jq -r '.id' "$f")
            echo "queued $b -> $id"
            IDS="$IDS $id"
          done
          [ -n "$IDS" ] || { echo "No workflows to run"; exit 1; }
          echo "WF_IDS=$IDS" >> "$GITHUB_ENV"

      - name: Run all queued workflows in n8n
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/workflows:/workflows:ro" \
            -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID -e FINNHUB_API_KEY -e WF_IDS \
            -e TZ=Asia/Kolkata -e GENERIC_TIMEZONE=Asia/Kolkata \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=false \
            -e NEWS_LOOKBACK_HOURS=6 \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            "docker.n8n.io/n8nio/n8n:${N8N_VERSION}" \
            -c 'n8n import:workflow --separate --input=/workflows || exit 1
                fail=0
                for id in $WF_IDS; do
                  echo "=== running $id ==="
                  n8n execute --id="$id" || { echo "FAILED: $id"; fail=1; }
                done
                exit $fail'
